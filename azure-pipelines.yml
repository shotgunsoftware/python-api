resources:
  repositories:
    - repository: templates
      type: github
      name: shotgunsoftware/tk-ci-tools
      # Testing the tk-ci-tools branch, revert to master before merging.
      ref: refs/heads/ticket/SG-47353-test-matrix-latest-images
      endpoint: shotgunsoftware
      # Despite using the "tk-" prefix, tk-ci-tools is not a Toolkit only tool.
      # We use it to avoid duplicating and maintaining CI pipeline code.

# We've stored some variables in Azure. They contain credentials
# and are encrypted. They are also not available to clients.
# This statement says which variable groups this repo requires.
# We have two: one that can be shared by all repos that use CI
# and another that is used just by the Python API, which creates
# HumanUser's and as such need a password, which we can't
# hardcode in the .yml files.
variables:
  - group: sg-credentials

# We want builds to trigger for 3 reasons:
# - The master branch sees new commits
# - Each PR should get rebuilt when commits are added to it.
trigger:
  branches:
    include:
    - master
pr:
  branches:
    include:
    - "*"

# This here is the list of jobs we want to run for our build.
# Jobs run in parallel.
jobs:
- template: azure-pipelines-templates/type_checking.yml

- template: build-pipeline.yml@templates
  parameters:
    # The Python API has no UI, so there are no resources to validate.
    has_ui_resources: false

    # Run the tests with the shared tk-ci-tools test jobs. They come with a lot
    # of default behavior (Python versions, Qt wrappers, operating systems and
    # runner images), defined in internal/run-tests.yml of tk-ci-tools. Review
    # those defaults when they change, and override them with
    # run_tests_extra_parameters if this repository needs something else.
    has_unit_tests: true

    run_tests_extra_parameters:
      extra_test_dependencies:
      - -r tests/requirements.txt

      # The Python API is not a Toolkit component. Without this, the tests
      # would import the shotgun_api3 bundled with tk-core instead of this
      # repository's code.
      use_tk_core: false

      pre_tests_steps:
      # The tests read the test data names from this file. The site and the
      # credentials come from the SG_* variables of tests_env.
      - bash: cp ./tests/example_config ./tests/config
        displayName: Create the test configuration

      # The Windows certificate store is missing the newer Amazon root
      # certificate, which some clients experienced too.
      - powershell: |
          $cert_url = "https://www.amazontrust.com/repository/SFSRootCAG2.cer"
          $cert_file = New-TemporaryFile
          Invoke-WebRequest -Uri $cert_url -UseBasicParsing -OutFile $cert_file.FullName
          Import-Certificate -FilePath $cert_file.FullName -CertStoreLocation Cert:\LocalMachine\Root
        displayName: Updating OS Certificates
        condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

      # Authenticate with the test site. On pull requests from forks, the
      # secrets are not available.
      tests_env:
        SG_SERVER_URL: $(ci_site)
        SG_SCRIPT_NAME: $(ci_site_script_name)
        SG_API_KEY: $(ci_site_script_key)
        # The tests modify the human user, so each job uses its own. These
        # users exist on the test site, one per OS and Python version, e.g.
        # <login>-Linux-3.9.
        SG_HUMAN_LOGIN: $(python_api_human_login)-$(tk_ci_os_name)-$(tk_ci_python_version)
        SG_HUMAN_NAME: $(python_api_human_name) $(tk_ci_os_name) $(tk_ci_python_version)
        SG_HUMAN_PASSWORD: $(python_api_human_password)
        # Each job gets its own project, deleted in the cleanup step below.
        SG_PROJECT_NAME: Python API CI - $(Build.BuildId) - $(tk_ci_os_name) - $(tk_ci_python_version)

      # Retry the tests that fail because of the test site.
      pytest_extra_args: [--reruns, '1', --reruns-delay, '2']

    post_tests_steps:
    - task: PythonScript@0
      displayName: Cleanup test project
      condition: always()
      inputs:
        scriptSource: inline
        workingDirectory: $(Build.SourcesDirectory)
        script: |
          import os, shotgun_api3, sys
          sg = shotgun_api3.Shotgun(
              os.environ['SG_SERVER_URL'],
              script_name=os.environ['SG_SCRIPT_NAME'],
              api_key=os.environ['SG_API_KEY'],
          )
          project = sg.find_one(
              entity_type='Project',
              filters=[['name', 'is', os.environ['SG_PROJECT_NAME']]],
          )
          if not project:
              print('Project not found, nothing to clean up.')
              sys.exit(0)
          sg.delete(entity_type='Project', entity_id=project['id'])
          print('Retired project:', os.environ['SG_PROJECT_NAME'])
      env:
        PYTHONPATH: $(Build.SourcesDirectory)
        SG_SERVER_URL: $(ci_site)
        SG_SCRIPT_NAME: $(ci_site_script_name)
        SG_API_KEY: $(ci_site_script_key)
        SG_PROJECT_NAME: Python API CI - $(Build.BuildId) - $(tk_ci_os_name) - $(tk_ci_python_version)
